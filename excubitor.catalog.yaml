services:
  - code: tela
    name: Tela Scene Overlay
    tier: local-app
    project_code: tela
    runtime: app
    repo: LUDIARS/Tela
    cwd: ${ARS_ROOT}/Tela
    exec: ${ARS_ROOT}/Tela/build-native/Release/tela_overlay.exe
    exec_args: [--font, '${ARS_ROOT}/Tela/build-native/assets/default.ttf', --transitions, '${ARS_ROOT}/Tela/build-native/transitions.tela']
    autostart: false
    restart_policy: 'no'
  - code: tela-probe-target
    name: Tela Separate Composition Target
    tier: local-app
    project_code: tela
    runtime: app
    repo: LUDIARS/Tela
    cwd: ${ARS_ROOT}/Tela
    exec: ${ARS_ROOT}/Tela/build-native/Release/tela_probe_target.exe
    autostart: false
    restart_policy: 'no'
  - code: tela-probe
    name: Tela Pictor Composition Probe
    tier: local-app
    project_code: tela
    runtime: app
    repo: LUDIARS/Tela
    cwd: ${ARS_ROOT}/Tela
    exec: ${ARS_ROOT}/Tela/build-native/Release/tela_overlay.exe
    exec_args: [--probe, --font, '${ARS_ROOT}/Tela/build-native/assets/default.ttf', --seconds, '120', --report, '${ARS_ROOT}/Tela/build-native/composition-report.json']
    autostart: false
    restart_policy: 'no'
  - code: tela-spec-view
    name: Tela Spec View Overlay
    tier: local-app
    project_code: tela
    runtime: app
    repo: LUDIARS/Tela
    cwd: ${ARS_ROOT}/Tela
    exec: ${ARS_ROOT}/Tela/build-native/Release/tela_overlay.exe
    exec_args: [--font, '${ARS_ROOT}/Tela/build-native/assets/default.ttf', --spec-view, '${ARS_ROOT}/Tela/build-native/spec-view.tela', --attach, probe-target, --seconds, '300']
    autostart: false
    restart_policy: 'no'
  # 仕様カードを対象ウインドウの内側ではなく右隣へ等倍で置くデモ。
  - code: tela-spec-view-beside
    name: Tela Spec View Beside Host
    tier: local-app
    project_code: tela
    runtime: app
    repo: LUDIARS/Tela
    cwd: ${ARS_ROOT}/Tela
    exec: ${ARS_ROOT}/Tela/build-native/Release/tela_overlay.exe
    exec_args: [--font, '${ARS_ROOT}/Tela/build-native/assets/default.ttf', --spec-view, '${ARS_ROOT}/Tela/build-native/spec-view.tela', --attach, probe-target, --place, right, --font-size, '16', --seconds, '300']
    autostart: false
    restart_policy: 'no'
  # Pf の内容を対象アプリ無しで実寸表示するネイティブビュー。
  - code: tela-view
    name: Tela Native View
    tier: local-app
    project_code: tela
    runtime: app
    repo: LUDIARS/Tela
    cwd: ${ARS_ROOT}/Tela
    exec: ${ARS_ROOT}/Tela/build-native/Release/tela_view.exe
    exec_args: [--font, '${ARS_ROOT}/Tela/build-native/assets/default.ttf', --spec-view, '${ARS_ROOT}/Tela/build-native/spec-view.tela', --title, 'Praeforma spec view', --seconds, '300']
    autostart: false
    restart_policy: 'no'
  # Pf のドメイン関係図をネイティブに表示する。
  - code: tela-graph-view
    name: Tela Domain Graph View
    tier: local-app
    project_code: tela
    runtime: app
    repo: LUDIARS/Tela
    cwd: ${ARS_ROOT}/Tela
    exec: ${ARS_ROOT}/Tela/build-native/Release/tela_view.exe
    exec_args: [--font, '${ARS_ROOT}/Tela/build-native/assets/default.ttf', --graph, '${ARS_ROOT}/Tela/build-native/domain-graph.tela', --title, 'Praeforma domain graph', --seconds, '300']
    autostart: false
    restart_policy: 'no'
